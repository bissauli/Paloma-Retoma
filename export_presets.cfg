html/head_include="<style>#girar{display:none;position:fixed;inset:0;z-index:100;background:#1d1a2b;color:#fffaf0;font:600 22px sans-serif;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.5}#girar b{font-size:56px;display:block;transform:rotate(90deg)}@media (orientation:portrait) and (pointer:coarse){#girar{display:flex}}</style>
<script>window.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='girar';d.innerHTML='<b>&#8635;</b>Girá el teléfono<br>para jugar a Paloma Retoma';document.body.appendChild(d);});var pantallaPedida=false;document.addEventListener('touchend',function(){if(pantallaPedida)return;pantallaPedida=true;var e=document.documentElement;var r=e.requestFullscreen||e.webkitRequestFullscreen;if(!r)return;try{var p=r.call(e);if(p&&p.then){p.then(function(){if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}}).catch(function(){});}}catch(x){}});</script>
<style>@font-face{font-family:'BebasCarga';src:url(carga/BebasNeue-Regular.ttf)}#carga{position:fixed;inset:0;z-index:50;background:#000;transition:opacity .45s .35s;overflow:hidden}#carga .esc{position:absolute;inset:0;overflow:hidden;opacity:0;animation:cEsc 28s linear infinite both}@keyframes cEsc{0%{opacity:0}4.3%{opacity:1}25%{opacity:1}29.3%{opacity:0}100%{opacity:0}}#carga .m{position:absolute;inset:0}#carga .c{position:absolute;inset:0;background-size:cover;background-position:center;animation-duration:14s;animation-timing-function:cubic-bezier(.37,0,.63,1);animation-iteration-count:infinite;animation-direction:alternate;animation-fill-mode:both}#carga .f{animation-name:cF}#carga .p{animation-name:cP}#carga .x .p{animation-name:cX}@keyframes cF{from{transform:translate(1.5%,.6%) scale(1.08)}to{transform:translate(-1.5%,-.6%) scale(1.035)}}@keyframes cP{from{transform:translate(-2.2%,.8%) scale(1)}to{transform:translate(2.4%,-.8%) scale(1.1)}}@keyframes cX{from{transform:translate(-3.5%,.5%) scale(1.02)}to{transform:translate(3.2%,-.5%) scale(1.11)}}#carga .som{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.8))}#carga .riel{position:absolute;left:40px;right:40px;bottom:24px;height:6px;background:rgba(255,255,255,.18)}#carga .bar{position:absolute;inset:0;background:#ffc740;transform-origin:left;transform:scaleX(0);animation:cBar 45s cubic-bezier(.15,.7,.3,1) forwards}#carga.fin .bar{animation:none;transform:scaleX(1)}@keyframes cBar{to{transform:scaleX(.95)}}#carga .pie{position:absolute;right:40px;bottom:40px;display:flex;align-items:center;color:#fff;font-family:'BebasCarga',Impact,sans-serif;font-size:min(46px,6vh);letter-spacing:1px;text-shadow:2px 2px 0 rgba(0,0,0,.6)}#carga .pt{margin-left:.25em;animation:punto 1.2s linear infinite;opacity:0}#carga .pt:nth-child(3){animation-delay:.4s}#carga .pt:nth-child(4){animation-delay:.8s}@keyframes punto{0%,33%{opacity:0}34%,100%{opacity:1}}#carga .pal{height:min(104px,14vh);aspect-ratio:200/166;overflow:hidden;position:relative;margin-left:20px}#carga .pal img{position:absolute;left:-8%;top:-33.73%;width:512%;height:308.43%;animation:cPic .96s step-end infinite}@keyframes cPic{0%{transform:translate(0,0)}12.5%{transform:translate(-25%,0)}25%{transform:translate(-50%,0)}37.5%{transform:translate(-75%,0)}50%{transform:translate(0,-50%)}62.5%{transform:translate(-25%,-50%)}75%{transform:translate(-50%,-50%)}87.5%,100%{transform:translate(-75%,-50%)}}</style>
<script>(function(){var d;function crear(){d=document.createElement('div');d.id='carga';var n=4,s=window.cargaN=Math.floor(Math.random()*n),h='';for(var j=0;j<n;j++){var t=(((j-s+n)%n)*7-1.2)+'s';h+=`<div class='esc${j==2?' x':''}' style='animation-delay:${t}'><div class='m mf'><div class='c f' style='background-image:url(carga/fondo${j+1}.jpg);animation-delay:${t}'></div></div><div class='m mp'><div class='c p' style='background-image:url(carga/palomas${j+1}.webp);animation-delay:${t}'></div></div></div>`;}var en=!/^es/i.test(navigator.language||'');d.innerHTML=h+`<div class=som></div><div class=riel><div class=bar></div></div><div class=pie><span>${en?'LOADING':'CARGANDO'}</span><span class=pt>.</span><span class=pt>.</span><span class=pt>.</span><div class=pal><img src=carga/picotea.png alt=></div></div>`;}crear();function poner(){document.body.appendChild(d);}if(document.body){poner();}else{document.addEventListener('DOMContentLoaded',poner);}window.ocultarCarga=function(){var o=d;o.classList.add('fin');o.style.opacity='0';o.style.pointerEvents='none';setTimeout(function(){if(o.parentNode){o.parentNode.removeChild(o);}},1000);};window.mostrarCarga=function(){if(d.parentNode&&d.style.opacity!=='0'){return;}crear();poner();};})();</script>
<script>(function(){window.cargaLista=new Promise(function(ok){var pend=4;var fin=function(){if(--pend<=0){ok();}};var fondo=new Image();fondo.onload=fondo.onerror=fin;fondo.src='carga/fondo'+(window.cargaN+1)+'.jpg';var aves=new Image();aves.onload=aves.onerror=fin;aves.src='carga/palomas'+(window.cargaN+1)+'.webp';var pal=new Image();pal.onload=pal.onerror=fin;pal.src='carga/picotea.png';(document.fonts&&document.fonts.load?document.fonts.load('40px BebasCarga'):Promise.resolve()).then(fin,fin);setTimeout(ok,5000);});var motor;Object.defineProperty(window,'Engine',{configurable:true,get:function(){return motor;},set:function(v){motor=v;if(v&&v.prototype&&v.prototype.startGame){var orig=v.prototype.startGame;v.prototype.startGame=function(){var yo=this,a=arguments;return window.cargaLista.then(function(){return orig.apply(yo,a);});};}}});})();</script>"
