html/head_include="<style>#girar{display:none;position:fixed;inset:0;z-index:100;background:#1d1a2b;color:#fffaf0;font:600 22px sans-serif;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.5}#girar b{font-size:56px;display:block;transform:rotate(90deg)}@media (orientation:portrait) and (pointer:coarse){#girar{display:flex}}</style>
<script>window.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='girar';d.innerHTML='<b>&#8635;</b>Girá el teléfono<br>para jugar a Paloma Retoma';document.body.appendChild(d);});var pantallaPedida=false;document.addEventListener('touchend',function(){if(pantallaPedida)return;pantallaPedida=true;var e=document.documentElement;var r=e.requestFullscreen||e.webkitRequestFullscreen;if(!r)return;try{var p=r.call(e);if(p&&p.then){p.then(function(){if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}}).catch(function(){});}}catch(x){}});</script>
<style>@font-face{font-family:'BebasCarga';src:url(carga/BebasNeue-Regular.ttf)}#carga{position:fixed;inset:0;z-index:50;background:#000;transition:opacity .6s;overflow:hidden}#carga .arte{position:absolute;left:0;right:0;top:8%;bottom:14%;background-size:cover;background-position:center}#carga .pie{position:absolute;left:0;right:40px;bottom:0;height:14%;display:flex;align-items:center;justify-content:flex-end;gap:18px;color:#fff;font-family:'BebasCarga',Impact,sans-serif;font-size:min(46px,6vh);letter-spacing:1px}#carga .pal{height:min(120px,16vh);aspect-ratio:204/193;overflow:hidden;position:relative}#carga .pal img{position:absolute;left:0;top:0;width:500%;height:100%;animation:picotear .8s steps(5) infinite}@keyframes picotear{from{transform:translateX(0)}to{transform:translateX(-100%)}}#carga .pt{animation:punto 1.2s linear infinite;opacity:0}#carga .pt:nth-child(3){animation-delay:.4s}#carga .pt:nth-child(4){animation-delay:.8s}@keyframes punto{0%,33%{opacity:0}34%,100%{opacity:1}}</style>
<script>(function(){var d=document.createElement('div');d.id='carga';var n=window.cargaN=1+Math.floor(Math.random()*5);d.innerHTML=`<div class=arte style=background-image:url(carga/fondo${n}.jpg)></div><div class=pie><span>CARGANDO</span><span class=pt>.</span><span class=pt>.</span><span class=pt>.</span><div class=pal><img src=carga/cargando.png alt=></div></div>`;function poner(){document.body.appendChild(d);}if(document.body){poner();}else{document.addEventListener('DOMContentLoaded',poner);}window.ocultarCarga=function(){d.style.opacity='0';d.style.pointerEvents='none';setTimeout(function(){if(d.parentNode){d.parentNode.removeChild(d);}},700);};})();</script>
<script>(function(){window.cargaLista=new Promise(function(ok){var pend=3;var fin=function(){if(--pend<=0){ok();}};var fondo=new Image();fondo.onload=fondo.onerror=fin;fondo.src='carga/fondo'+window.cargaN+'.jpg';var pal=new Image();pal.onload=pal.onerror=fin;pal.src='carga/cargando.png';(document.fonts&&document.fonts.load?document.fonts.load('40px BebasCarga'):Promise.resolve()).then(fin,fin);setTimeout(ok,5000);});var motor;Object.defineProperty(window,'Engine',{configurable:true,get:function(){return motor;},set:function(v){motor=v;if(v&&v.prototype&&v.prototype.startGame){var orig=v.prototype.startGame;v.prototype.startGame=function(){var yo=this,a=arguments;return window.cargaLista.then(function(){return orig.apply(yo,a);});};}}});})();</script>"
