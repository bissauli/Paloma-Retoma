		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<style>@font-face{font-family:'BebasCarga';src:url(carga/BebasNeue-Regular.ttf)}#carga{position:fixed;inset:0;z-index:50;background:#000;transition:opacity .45s .35s;overflow:hidden}#carga .esc{position:absolute;inset:0;overflow:hidden;opacity:0;animation:cEsc 28s linear infinite both}@keyframes cEsc{0%{opacity:0}4.3%{opacity:1}25%{opacity:1}29.3%{opacity:0}100%{opacity:0}}#carga .m{position:absolute;inset:0}#carga .c{position:absolute;inset:0;background-size:cover;background-position:center;animation-duration:14s;animation-timing-function:cubic-bezier(.37,0,.63,1);animation-iteration-count:infinite;animation-direction:alternate;animation-fill-mode:both}#carga .f{animation-name:cF}#carga .p{animation-name:cP}#carga .x .p{animation-name:cX}@keyframes cF{from{transform:translate(1.5%,.6%) scale(1.08)}to{transform:translate(-1.5%,-.6%) scale(1.035)}}@keyframes cP{from{transform:translate(-2.2%,.8%) scale(1)}to{transform:translate(2.4%,-.8%) scale(1.1)}}@keyframes cX{from{transform:translate(-3.5%,.5%) scale(1.02)}to{transform:translate(3.2%,-.5%) scale(1.11)}}#carga .som{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.8))}#carga .riel{position:absolute;left:40px;right:40px;bottom:24px;height:6px;background:rgba(255,255,255,.18)}#carga .bar{position:absolute;inset:0;background:#ffc740;transform-origin:left;transform:scaleX(0);animation:cBar 45s cubic-bezier(.15,.7,.3,1) forwards}#carga.fin .bar{animation:none;transform:scaleX(1)}@keyframes cBar{to{transform:scaleX(.95)}}#carga .pie{position:absolute;right:40px;bottom:40px;display:flex;align-items:center;color:#fff;font-family:'BebasCarga',Impact,sans-serif;font-size:min(46px,6vh);letter-spacing:1px;text-shadow:2px 2px 0 rgba(0,0,0,.6)}#carga .pt{margin-left:.25em;animation:punto 1.2s linear infinite;opacity:0}#carga .pt:nth-child(3){animation-delay:.4s}#carga .pt:nth-child(4){animation-delay:.8s}@keyframes punto{0%,33%{opacity:0}34%,100%{opacity:1}}#carga .pal{he <script>(function(){window.cargaLista=new Promise(function(ok){var pend=4;var fin=function(){if(--pend<=0){ok();}};var fondo=new Image();fondo.onload=fondo.onerror=fin;fondo.src='carga/fondo'+(window.cargaN+1)+'.jpg';var aves=new Image();aves.onload=aves.onerror=fin;aves.src='carga/palomas'+(window.cargaN+1)+'.webp';var pal=new Image();pal.onload=pal.onerror=fin;pal.src='carga/picotea.png';(document.fonts&&document.fonts.load?document.fonts.load('40px BebasCarga'):Promise.resolve()).then(fin,fin);setTimeout(ok,5000);});var motor;Object.defineProperty(window,'Engine',{configurable:true,get:function(){return motor;},set:function(v){motor=v;if(v&&v.prototype&&v.prototype.startGame){var orig=v.prototype.startGame;v.prototype.startGame=function(){var yo=this,a=arguments;return window.cargaLista.then(function(){return orig.apply(yo,a);});};}}});})();</script>

			<progress id="status-progress"></progress>
			<div id="status-notice"></div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":45300640,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
